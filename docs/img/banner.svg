<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Calculadora de Tributos: Calcule CBS e IBS no Simples Nacional">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.6" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f0ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <circle cx="1120" cy="-20" r="220" fill="#ffffff" opacity="0.07"/>
  <circle cx="1220" cy="380" r="160" fill="#ffffff" opacity="0.08"/>
  <circle cx="60" cy="420" r="140" fill="#ffffff" opacity="0.06"/>

  <text x="80" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#bfdbfe" letter-spacing="3">SIMPLES NACIONAL</text>
  <text x="80" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff">Calculadora de Tributos</text>
  <text x="80" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#e0ecff">Calcule CBS e IBS no Simples Nacional</text>
  <text x="80" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#e0ecff">com o resultado e o erro de cada item</text>

  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
  <rect x="860" y="100" width="300" height="70" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
