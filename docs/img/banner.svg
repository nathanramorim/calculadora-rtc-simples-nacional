  <text x="1010" y="155" font-size="16" fill="#475569">Simples Nacional</text>
  <path d="M1010 172 L1010 206" stroke="#ffffff" stroke-width="3" fill="none"/>
  <path d="M1000 198 L1010 210 L1020 198 Z" fill="#ffffff"/>
  <rect x="860" y="214" width="300" height="70" rx="12" fill="#1e3a8a"/>
  <text x="1010" y="244" font-size="24" font-weight="700" fill="#ffffff">CBS · IBS</text>
  <text x="1010" y="269" font-size="16" fill="#dbeafe">cada item calculado à parte</text>
  <path d="M1010 286 L1010 320" stroke="#ffffff" stroke-width="3" fill="none"/>
  <path d="M1000 312 L1010 324 L1020 312 Z" fill="#ffffff"/>
  <rect x="860" y="328" width="300" height="40" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
